#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#应用
# 版本号唯一来源；发布时由 CI 通过 -PappVersion=x.y.z 覆盖，见 .github/workflows/release.yml
appVersion=1.1.0

#依赖仓库
# true = 阿里云镜像优先（国内网络快）；false = 只用官方仓库（CI 与海外网络必须用 false，
# 否则镜像回源不及时会让 Gradle 插件解析失败，见 settings.gradle.kts）
useChinaMirrors=false

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true