#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#应用
# 版本号唯一来源；发布时由 CI 通过 -PappVersion=x.y.z 覆盖，见 .github/workflows/release.yml
appVersion=1.3.0

#依赖仓库
# true = 阿里云镜像优先（国内网络快）；false = 只用官方仓库。
# 本地默认 true：plugins.gradle.org 在国内极不稳（实测多次直接连接超时），
# 而 foojay / KSP 这类只在插件门户发布的构件，只有阿里云的 gradle-plugin 仓库代理得到。
# CI 与海外网络必须 false（镜像回源不及时会让插件解析失败），
# 由 workflow 的 ORG_GRADLE_PROJECT_useChinaMirrors=false 覆盖，见 .github/workflows/。
useChinaMirrors=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true