name: Release

on:
  # 推送 vX.Y.Z 形式的 tag 时自动发布
  push:
    tags:
      - "v*.*.*"
  # 也允许手动指定 tag 补发
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（必须形如 v1.0.0）
        required: true
        type: string

# 同一 tag 的并发发布只保留最新一次
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 macOS 安装包
    # 打包目标为 .dmg，必须在 macOS 上执行
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      # runner 在海外，走阿里云镜像会因回源不及时或超时导致插件解析失败
      ORG_GRADLE_PROJECT_useChinaMirrors: "false"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析并校验版本号
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          # Compose Desktop 的 packageVersion 只接受 x.y.z，各段必须是数字
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$tag' 不是 vX.Y.Z 形式，无法作为包版本"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          echo "tag=${tag}，packageVersion=${version}"

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 打包 DMG
        run: |
          ./gradlew :desktopApp:packageReleaseDmg \
            -PappVersion=${{ steps.version.outputs.version }} \
            --stacktrace

      - name: 生成 SHA-256 校验和
        run: |
          set -euo pipefail
          cd desktopApp/build/compose/binaries/main-release/dmg
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 从 CHANGELOG 生成本版发布说明
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="RELEASE_NOTES.md"

          # 该版本的段落 = CHANGELOG.md 里的 "## [x.y.z]" 到下一个 "## [" 之间（不含标题行）
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"

          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md 里没有 ${VERSION} 的段落，请先补上再发布"
            exit 1
          fi

          echo "----- RELEASE_NOTES.md -----"
          cat "$notes"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # 本版变更由上面从 CHANGELOG 生成；generate_release_notes 只补一行 Full Changelog 对比链接
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            desktopApp/build/compose/binaries/main-release/dmg/*.dmg
            desktopApp/build/compose/binaries/main-release/dmg/SHA256SUMS.txt
          fail_on_unmatched_files: true
