name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复触发只保留最新一次
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建与检查
    # 本项目依赖 AppKit / NSStatusItem，只能在 macOS 上编译与运行
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      # runner 在海外，走阿里云镜像会因回源不及时或超时导致插件解析失败
      ORG_GRADLE_PROJECT_useChinaMirrors: "false"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 构建
        run: ./gradlew build --stacktrace

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: "**/build/reports/"
          if-no-files-found: ignore
          retention-days: 7
