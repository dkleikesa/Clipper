<?xml version="1.0" encoding="UTF-8"?>
<!--
  Clipper 应用图标（1024 × 1024 主稿）

  线条不动：
    图形用的就是设计稿那一条 <path d>，逐字节原样照搬，只做了
    0.76 缩放 + 按图形重心 (509, 540) 对中——和 shared 里的
    `ClipperAppIcon`、Android 的 `ic_launcher_foreground.xml` 同一套摆位；
    碗内那层「汤」是原始 d 里碗内圈挖空子路径的等价写法（起止点一致），
    没有新增或改动任何线条。

  配色（由外到内 6 层，全部只用渐变 / 描边 / 透明度，
  不依赖模糊滤镜，因此能 1:1 映射成 Android VectorDrawable 与 Compose ImageVector）：
    1 底色      深靛蓝对角渐变（左上偏紫、右下压深）
    2 碗底暖光  径向暖橙，像碗里冒出来的热气
    3 右上冷光  径向青蓝，避免底色一整片死紫
    4 左上柔光  径向白色 20%，玻璃质感高光
    5 内描边    1 圈白色 16% 细线，边缘更精致
    6 图形      白色 → 米金渐变；碗内叠加暖色「汤」渐变
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 1 底色 -->
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0" stop-color="#6D4EF5"/>
      <stop offset="0.5" stop-color="#241C6E"/>
      <stop offset="1" stop-color="#0B0926"/>
    </linearGradient>

    <!-- 2 碗底暖光 -->
    <radialGradient id="glowWarm" gradientUnits="userSpaceOnUse" cx="512" cy="858" r="280">
      <stop offset="0" stop-color="#FFAE4A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFAE4A" stop-opacity="0"/>
    </radialGradient>

    <!-- 3 右上冷光 -->
    <radialGradient id="glowCool" gradientUnits="userSpaceOnUse" cx="920" cy="120" r="520">
      <stop offset="0" stop-color="#4FC8FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4FC8FF" stop-opacity="0"/>
    </radialGradient>

    <!-- 4 左上柔光 -->
    <radialGradient id="sheen" gradientUnits="userSpaceOnUse" cx="220" cy="90" r="620">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 6a 碗内「汤」 -->
    <linearGradient id="broth" gradientUnits="userSpaceOnUse" x1="512" y1="545" x2="512" y2="905">
      <stop offset="0" stop-color="#FFB454" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FF8A1E" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 6b 线条本体 -->
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="400" y1="110" x2="660" y2="960">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFF3DC"/>
      <stop offset="1" stop-color="#FFC169"/>
    </linearGradient>
  </defs>

  <!-- 1 圆角底板 + 底色（圆角半径 232，与 ClipperAppIcon / Android 前景层同一画布定义） -->
  <path d="M232 0H792A232 232 0 0 1 1024 232V792A232 232 0 0 1 792 1024H232A232 232 0 0 1 0 792V232A232 232 0 0 1 232 0Z" fill="url(#tile)"/>
  <!-- 2/3/4 三盏光 -->
  <path d="M232 0H792A232 232 0 0 1 1024 232V792A232 232 0 0 1 792 1024H232A232 232 0 0 1 0 792V232A232 232 0 0 1 232 0Z" fill="url(#glowCool)"/>
  <path d="M232 0H792A232 232 0 0 1 1024 232V792A232 232 0 0 1 792 1024H232A232 232 0 0 1 0 792V232A232 232 0 0 1 232 0Z" fill="url(#glowWarm)"/>
  <path d="M232 0H792A232 232 0 0 1 1024 232V792A232 232 0 0 1 792 1024H232A232 232 0 0 1 0 792V232A232 232 0 0 1 232 0Z" fill="url(#sheen)"/>
  <!-- 5 内描边（内缩 3，描边 4） -->
  <path d="M232 3H792A229 229 0 0 1 1021 232V792A229 229 0 0 1 792 1021H232A229 229 0 0 1 3 792V232A229 229 0 0 1 232 3Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"/>

  <!-- 6 图形：0.76 缩放 + 对中（512 - 509 × 0.76 = 125.16，512 - 540 × 0.76 = 101.6） -->
  <g transform="translate(125.16 101.6) scale(0.76)">
    <!-- 碗内「汤」：原始 d 中碗内圈挖空子路径的等价写法（起点 498.1 899.5 即原 d 的当前点） -->
    <path d="M498.1 899.5c-192.5 0-356.7-151.5-383.6-353.9h767.2C854.8 748 690.6 899.5 498.1 899.5z"
          fill="url(#broth)"/>
    <!-- 原始线条：与设计稿 d 完全一致 -->
    <path fill="url(#line)" d="M936.9 201.6c14.2 0 25.5-11.3 25.5-25.5v-9.9c0-14.2-11.3-25.5-25.5-25.5H627c-3.2-9.6-12.5-17-22.8-17h-9.9c-10.3 0-19.6 7.4-22.8 17h-30.9c-3.2-9.6-12.5-17-22.8-17H508c-10.3 0-19.6 7.4-22.8 17H450c-3.2-9.6-12.5-17-22.8-17h-9.9c-10.3 0-19.6 7.4-22.8 17h-70.7c-14.2 0-25.5 11.3-25.5 25.5v9.9c0 14.2 11.3 25.5 25.5 25.5h69.4v38.2h-69.4c-14.2 0-25.5 11.3-25.5 25.5v9.9c0 14.2 11.3 25.5 25.5 25.5h69.4v182.6c0 1.4 0.2 2.9 0.5 4.2H110.2c-32.6 0-58 28.3-53.8 60.9 28.3 230.7 215.2 409.1 441.7 409.1s413.3-178.4 441.7-409.1c4.2-32.6-19.8-60.9-52.4-60.9H627.8c0.3-1.4 0.5-2.8 0.5-4.2V300.7h308.6c14.2 0 25.5-11.3 25.5-25.5v-9.9c0-14.2-11.3-25.5-25.5-25.5H628.3v-38.2h308.6z m-485.6 0h32.6v38.2h-32.6v-38.2z m0 281.7V300.7h32.6v182.6c0 1.4 0.2 2.9 0.5 4.2h-33.1c0.1-1.3 0.2-2.8 0-4.2z m46.8 416.2c-192.5 0-356.7-151.5-383.6-353.9h767.2C854.8 748 690.6 899.5 498.1 899.5z m72.6-412h-29.2c0.3-1.4 0.5-2.8 0.5-4.2V300.7h28.3v182.6c-0.1 1.4 0.1 2.9 0.4 4.2z m-0.5-247.7h-28.3v-38.2h28.3v38.2z"/>
  </g>
</svg>
